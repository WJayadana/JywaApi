openapi: 3.1.0
info:
  title: Jywa API
  version: 1.0.0
  description: |
    Fondasi API untuk platform PPOB Jywa. Saat ini mencakup manajemen user, role,
    JWT authentication, saldo, dan audit mutasi saldo.

    Otentikasi: Bearer JWT didapat dari `POST /api/auth/register` atau
    `POST /api/auth/login`.
  contact:
    name: Jywa
    email: admin@jywa.tech
  license:
    name: Private
servers:
  - url: https://jywa.tech
    description: Production
  - url: http://127.0.0.1:3000
    description: Local development
tags:
  - name: System
    description: Health dan metadata API
  - name: Auth
    description: Registrasi dan login
  - name: Users
    description: Profil user dan riwayat mutasi
  - name: Owner
    description: Endpoint khusus role owner
  - name: Digiflazz
    description: Provider PPOB Digiflazz (khusus owner)
paths:
  /:
    get:
      operationId: getRoot
      tags: [System]
      summary: API metadata
      security: []
      responses:
        '200':
          description: Metadata API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
              example:
                name: Jywa API
                version: 1.0.0
                health: /health
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: API dan database sehat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: jywa-api
                timestamp: '2026-08-28T16:50:50.858Z'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Registrasi user baru
      security: []
      description: |
        Membuat user baru dengan role default `bronze`.
        Endpoint ini rate-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic:
                value:
                  username: user1
                  email: user1@example.com
                  phone: '08123456789'
                  password: password-123
      responses:
        '201':
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login
      security: []
      description: |
        Login memakai `identifier` berisi username atau email.
        Endpoint ini rate-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              username:
                value:
                  identifier: jayadana
                  password: password-123
              email:
                value:
                  identifier: user@example.com
                  password: password-123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/users/me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Profil user login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateMe
      tags: [Users]
      summary: Update profil user login
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnProfileRequest'
            examples:
              update_email:
                value:
                  email: user2@example.com
              update_phone:
                value:
                  phone: '08123456780'
      responses:
        '200':
          description: Profil terupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/me/mutations:
    get:
      operationId: getMyMutations
      tags: [Users]
      summary: Riwayat mutasi saldo user login
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [deposit, pembelian, refund]
      responses:
        '200':
          description: Daftar mutasi user login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users:
    get:
      operationId: listUsers
      tags: [Owner]
      summary: Daftar semua user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, bronze, silver, gold, reseller]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, banned]
        - name: search
          in: query
          schema:
            type: string
          description: Cari di username, email, atau phone
      responses:
        '200':
          description: Daftar user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{id}:
    get:
      operationId: getUser
      tags: [Owner]
      summary: Detail user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detail user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateUser
      tags: [Owner]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              upgrade_role:
                value:
                  role: reseller
              suspend:
                value:
                  status: suspended
      responses:
        '200':
          description: User terupdate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: banUser
      tags: [Owner]
      summary: Soft-ban user
      description: Mengubah status user menjadi `banned`; data dan mutasi tetap tersimpan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User berhasil dibanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/{id}/balance:
    post:
      operationId: changeBalance
      tags: [Owner]
      summary: Tambah atau kurangi saldo user
      description: |
        Perubahan saldo selalu dicatat sebagai mutasi audit.
        `amount` adalah integer dalam Rupiah.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceChangeRequest'
            examples:
              deposit:
                value:
                  type: deposit
                  direction: +
                  amount: 50000
                  note: deposit awal test
                  ref_id: dep-001
              refund:
                value:
                  type: refund
                  direction: +
                  amount: 10000
                  note: refund pembelian gagal
                  ref_id: trx-123
      responses:
        '201':
          description: Saldo berubah dan mutasi tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceChangeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{id}/mutations:
    get:
      operationId: getUserMutations
      tags: [Owner]
      summary: Riwayat mutasi user lain
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [deposit, pembelian, refund]
      responses:
        '200':
          description: Daftar mutasi user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/digiflazz/saldo:
    get:
      operationId: getDigiflazzSaldo
      tags: [Digiflazz]
      summary: Cek saldo Digiflazz
      description: Proxy ke endpoint cek-saldo Digiflazz. Hanya role owner.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo deposit Digiflazz
          content:
            application/json:
              schema:
                type: object
                properties:
                  deposit:
                    type: number
              example:
                deposit: 500000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/digiflazz/harga:
    get:
      operationId: getDigiflazzHarga
      tags: [Digiflazz]
      summary: Daftar harga produk Digiflazz
      description: |
        Membaca daftar harga dari JSON cache lokal (bukan langsung ke upstream Digiflazz).
        Cache otomatis disinkronkan setiap 10 menit (round-robin prepaid↔pasca).

        Harga otomatis di-markup sesuai role pemanggil.
        Role markup: owner (no markup), bronze +3%, silver +2%, gold +1%, reseller +50 (flat).
        Setiap produk menyertakan harga_modal (harga asli Digiflazz) dan harga
        (object per-role atau nilai tunggal bila filter role diberikan).
        Tanpa role, response memuat full map harga: owner/bronze/silver/gold/reseller.

        Filter: cmd=prepaid (default) atau cmd=pasca, category, search, status=true, role.
        Gunakan POST /api/digiflazz/harga/refresh untuk sinkronisasi manual.
      security:
        - bearerAuth: []
      parameters:
        - name: cmd
          in: query
          schema:
            type: string
            enum: [prepaid, pasca]
            default: prepaid
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: boolean
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, bronze, silver, gold, reseller]
          description: "Harga dihitung untuk role ini (defaultnya: role dari token yang memanggil)"
      responses:
        '200':
          description: Daftar produk dari cache dengan harga markup
          content:
            application/json:
              schema:
                type: object
                required: [products, source]
                properties:
                  products:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/DigiflazzProduct'
                        - type: object
                          properties:
                            harga_modal:
                              type: number
                            harga:
                              oneOf:
                                - type: number
                                - type: object
                                  properties:
                                    owner: { type: number }
                                    bronze: { type: number }
                                    silver: { type: number }
                                    gold: { type: number }
                                    reseller: { type: number }
                  role:
                    type: string
                    enum: [owner, bronze, silver, gold, reseller]
                  source:
                    type: string
                    enum: [cache]
                    example: cache
                  last_updated:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/digiflazz/harga/refresh:
    post:
      operationId: refreshDigiflazzHarga
      tags: [Digiflazz]
      summary: Sinkronkan daftar harga dari Digiflazz
      description: Memanggil upstream Digiflazz dan menyimpan hasil ke database cache. Rate limit Digiflazz ±5 menit.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  enum: [prepaid, pasca]
                  default: prepaid
      responses:
        '200':
          description: Sinkronisasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: boolean
                  cmd:
                    type: string
                  count:
                    type: integer
                  last_updated:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/digiflazz/deposit:
    post:
      operationId: createDigiflazzDeposit
      tags: [Digiflazz]
      summary: Buat tiket deposit Digiflazz
      description: Hanya role owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigiflazzDepositRequest'
            example:
              amount: 100000
              bank: BCA
              owner_name: Jayadana
      responses:
        '200':
          description: Tiket deposit berhasil dibuat
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/digiflazz/transaksi:
    post:
      operationId: createDigiflazzTransaction
      tags: [Digiflazz]
      summary: Transaksi PPOB Digiflazz
      description: Topup prepaid atau inquiry/payment/status pascabayar. Hanya role owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigiflazzTransactionRequest'
            example:
              sku: xld25
              customer_no: '08123456789'
              ref_id: trx-001
              testing: true
      responses:
        '200':
          description: Response transaksi dari Digiflazz
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/ProviderError'
  /api/digiflazz/webhook:
    post:
      operationId: receiveDigiflazzWebhook
      tags: [Digiflazz]
      summary: Terima webhook Digiflazz
      description: Endpoint publik yang memverifikasi X-Hub-Signature dengan HMAC-SHA1.
      security: []
      parameters:
        - name: X-Hub-Signature
          in: header
          required: true
          schema:
            type: string
            example: sha1=...
        - name: X-Digiflazz-Event
          in: header
          schema:
            type: string
            example: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Webhook diterima
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Webhook secret belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: ValidationError
            message: 'username must be 3-32 chars'
    Unauthorized:
      description: Token hilang, invalid, atau expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            message: Missing bearer token
    Forbidden:
      description: User tidak punya akses atau akun tidak aktif
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
            message: Insufficient role
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NotFound
            message: user not found
    Conflict:
      description: Konflik data unik atau saldo tidak mencukupi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Conflict
            message: username or email is already registered
    TooManyRequests:
      description: Rate limit tercapai
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: TooManyRequests
            message: too many authentication attempts; try again later
    ServiceUnavailable:
      description: Service atau database sedang tidak sehat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthErrorResponse'
          example:
            status: error
            service: jywa-api
    ProviderError:
      description: Error dari provider Digiflazz (upstream)
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: DigiflazzError
              message:
                type: string
              code:
                type: string
  schemas:
    DigiflazzProduct:
      type: object
      additionalProperties: true
      properties:
        buyer_sku_code:
          type: string
        product_name:
          type: string
        price:
          type: number
        buyer_product_status:
          type: boolean
        seller_product_status:
          type: boolean
    DigiflazzDepositRequest:
      type: object
      required: [amount, bank, owner_name]
      properties:
        amount:
          type: integer
          minimum: 1
        bank:
          type: string
          description: BCA, MANDIRI, BRI, BNI, Flip, atau ShopeePay sesuai akun Digiflazz
        owner_name:
          type: string
    DigiflazzTransactionRequest:
      type: object
      required: [sku, customer_no, ref_id]
      properties:
        sku:
          type: string
          description: buyer_sku_code
        customer_no:
          type: string
        ref_id:
          type: string
        commands:
          type: string
          enum: [inq-pasca, pay-pasca, status-pasca]
        testing:
          type: boolean
    ApiInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        health:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: jywa-api
        timestamp:
          type: string
          format: date-time
    HealthErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        service:
          type: string
          example: jywa-api
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required: [error, message]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [owner, bronze, silver, gold, reseller]
        balance:
          type: integer
          description: Saldo dalam Rupiah
        status:
          type: string
          enum: [active, suspended, banned]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, phone, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [password]
      properties:
        identifier:
          type: string
          description: username atau email
        username:
          type: string
          description: fallback kompatibilitas
        password:
          type: string
    UpdateOwnProfileRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [owner, bronze, silver, gold, reseller]
        status:
